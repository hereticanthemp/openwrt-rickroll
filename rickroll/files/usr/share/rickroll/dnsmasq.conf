# Static options for the rickroll DNS server.
#
# This is a separate dnsmasq process, not a UCI dnsmasq instance: the dnsmasq
# init script applies dhcp/host sections without "instance" to every instance.
# The firewall redirects all DNS (tcp/udp 53) from the rickroll network here.
# Every name resolves to the portal address, so no .lan host name leaks.
# /etc/init.d/rickroll adds --port, --listen-address and --address=/#/<ip>.
# There is no dhcp-range: the main dnsmasq serves DHCP for this network.
bind-dynamic
no-resolv
no-hosts
no-poll
bogus-priv
cache-size=0
local=/#/
